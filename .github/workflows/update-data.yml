name: クマ出没データの自動更新

on:
  schedule:
    - cron: "0 21 * * *"  # 毎日 6:00 JST
  workflow_dispatch:       # GitHubの画面から手動実行も可能

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ライブラリのインストール
        run: pip install -r data-pipeline/requirements.txt

      - name: データの取得・正規化
        run: python data-pipeline/fetch_and_normalize.py

      - name: 変更があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.geojson data-pipeline/geocode_cache.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "データ自動更新 $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M')"
            git push
          fi
